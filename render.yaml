services:
  - type: web
    name: propverse-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PROPVERSE_DEBUG
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: propverse-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: propverse-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

databases:
  - name: propverse-db
    databaseName: propverse
    user: propverse
